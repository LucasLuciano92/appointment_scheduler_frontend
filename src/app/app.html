<header class="site-header">
  <a class="brand" routerLink="/servicios" aria-label="Ir al inicio">
    <span class="brand__mark" aria-hidden="true">AS</span>
    <span>Appointment Scheduler</span>
  </a>
  <nav aria-label="Navegación principal">
    <a routerLink="/servicios" routerLinkActive="active">Servicios</a>
    @if (auth.session()) {
      <a routerLink="/turnos" routerLinkActive="active">Mis turnos</a>
      <a routerLink="/perfil" routerLinkActive="active">Perfil</a>
      <button class="button" type="button" (click)="logout()">Salir</button>
    } @else {
      <a routerLink="/registro" routerLinkActive="active">Registrarse</a>
      <a class="button" routerLink="/ingresar">Ingresar</a>
    }
  </nav>
</header>

<main><router-outlet /></main>

<footer>Appointment Scheduler · Programación IV · {{ year }}</footer>
